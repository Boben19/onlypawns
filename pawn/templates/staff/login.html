{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff login - Only Pawns</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'pawn/css/app.css' %}"></head>
<body><div class="center"><form method="post" class="card login">{% csrf_token %}
<h1>Only <span style="color:var(--pink)">Pawns</span></h1>
<p class="soft">Staff sign in. Customers use the <a href="/app/">app</a>.</p>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<div class="field"><label for="u">Username</label><input class="in" id="u" name="username" autocomplete="username" autofocus required></div>
<div class="field"><label for="p">Password</label><input class="in" id="p" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn block">Sign in</button>
</form></div></body></html>
