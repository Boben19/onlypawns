{% if page and page.paginator.num_pages > 1 %}<div class="pager"><span class="soft small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
{% if page.has_previous %}<a class="btn ghost sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
{% if page.has_next %}<a class="btn ghost sm" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}">Next</a>{% endif %}</div>{% endif %}
